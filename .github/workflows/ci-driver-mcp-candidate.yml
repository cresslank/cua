# SCRATCH BRANCH ONLY. Reuse the registered workflow path so workflow_dispatch
# works without adding a new workflow to the fork's default branch. Do not merge.
name: "DIAGNOSTIC: Windows Edge foreground (artifact only)"
run-name: "Edge foreground diagnostic / candidate ${{ inputs.candidate_run }}"

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: "Successful CI Driver MCP candidate run in cresslank/cua"
        type: string
        required: true
        default: "40173066492"
      candidate_sha:
        description: "Exact candidate source SHA (not this harness commit)"
        type: string
        required: true
        default: "8871472ea121943ff2ce12ac81c6ab7fcab8d915"
      zero_first:
        description: "Run timeout-zero control first, then restore original timeout for subsequent controls"
        type: boolean
        required: true
        default: false
      policy_first:
        description: "Run policy-on first on a fresh runner, then the original policy control"
        type: boolean
        required: true
        default: false
      lock_timeout_control:
        description: "Also test temporary supported ForegroundLockTimeout=0 (restore/read back)"
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-edge-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'cresslank/cua' && startsWith(github.ref, 'refs/heads/scratch/windows-edge-')
    name: "Windows / native foreground diagnostic (not qualification)"
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      LOCK_TIMEOUT_CONTROL: ${{ inputs.lock_timeout_control }}
      POLICY_FIRST: ${{ inputs.policy_first }}
      ZERO_FIRST: ${{ inputs.zero_first }}
    steps:
      - name: Select disposable artifact/evidence paths
        run: |
          "DIAGNOSTIC_ROOT=$(Join-Path $env:RUNNER_TEMP 'edge-foreground-diagnostic')" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CANDIDATE_ROOT=$(Join-Path $env:RUNNER_TEMP 'edge-foreground-candidate')" | Add-Content -LiteralPath $env:GITHUB_ENV
          "ARTIFACT_ROOT=$(Join-Path $env:RUNNER_TEMP 'edge-foreground-artifact')" | Add-Content -LiteralPath $env:GITHUB_ENV
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check harness parser, compiler, verdicts and stdio transport (not native qualification)
        run: ./scripts/ci/windows-edge/test-contracts.ps1
      - name: Download exact successful candidate (no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_RUN -notmatch '^[1-9][0-9]*$' -or $env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid candidate identity' }
          New-Item -ItemType Directory -Path $env:DIAGNOSTIC_ROOT, $env:ARTIFACT_ROOT | Out-Null
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA -or (git status --porcelain)) { throw 'Harness checkout identity/cleanliness mismatch' }
          $metadata = gh run view $env:CANDIDATE_RUN -R cresslank/cua --json status,conclusion,headSha,headBranch,workflowName,workflowDatabaseId,url
          if ($LASTEXITCODE -ne 0) { throw 'Candidate run lookup failed: diagnostic BLOCKED' }
          $metadata | Set-Content -LiteralPath "$env:DIAGNOSTIC_ROOT/candidate-run.json" -Encoding utf8
          $run = $metadata | ConvertFrom-Json
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.headSha -cne $env:CANDIDATE_SHA -or $run.workflowDatabaseId -ne 384010651) { throw 'Candidate run identity/status mismatch: diagnostic BLOCKED' }
          gh run download $env:CANDIDATE_RUN -R cresslank/cua --name "driver-mcp-candidate-Windows-$env:CANDIDATE_SHA" --dir $env:ARTIFACT_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact unavailable/expired: diagnostic BLOCKED (no rebuild or substitute)' }
      - name: Verify archive provenance and all file hashes before execution
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import tarfile

          artifact = Path(os.environ["ARTIFACT_ROOT"])
          output = Path(os.environ["CANDIDATE_ROOT"])
          source = os.environ["CANDIDATE_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          names = {"cua-driver.exe", "cua-cursor-theme.exe", "cua-driver-uia.exe"}
          provenance_bytes = (artifact / "provenance.json").read_bytes()
          provenance = json.loads(provenance_bytes)
          assert provenance["source_sha"] == source and provenance["runner_os"] == "Windows"
          assert set(provenance["files"]) == names
          assert all(re.fullmatch(r"[0-9a-f]{64}", value) for value in provenance["files"].values())
          output.mkdir(exist_ok=False)
          with tarfile.open(artifact / "candidate.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              assert len(members) == 4 and {item.name for item in members} == names | {"provenance.json"}
              assert all(item.isfile() and 0 < item.size < 512 * 1024 * 1024 for item in members)
              # Fixed basename inventory, no extraction of links/path traversal/extra executable content.
              payloads = {item.name: archive.extractfile(item).read() for item in members}
          assert payloads["provenance.json"] == provenance_bytes
          for name in sorted(names):
              actual = hashlib.sha256(payloads[name]).hexdigest()
              assert actual == provenance["files"][name], f"Hash mismatch: {name}"
          for name, data in payloads.items():
              (output / name).write_bytes(data)
          receipt = {"verified_source": source, "files": provenance["files"],
                     "archive_sha256": hashlib.sha256((artifact / "candidate.tar.gz").read_bytes()).hexdigest()}
          (Path(os.environ["DIAGNOSTIC_ROOT"]) / "artifact-verification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
      - name: Run native foreground variants (preserve failures)
        run: |
          & ./scripts/ci/windows-edge/diagnose.ps1 `
            -CandidateDirectory $env:CANDIDATE_ROOT `
            -OutputDirectory $env:DIAGNOSTIC_ROOT `
            -ExpectedSource $env:CANDIDATE_SHA `
            -PolicyFirst:($env:POLICY_FIRST -eq 'true') `
            -ZeroFirst:($env:ZERO_FIRST -eq 'true') `
            -IncludeLockTimeoutControl:($env:LOCK_TIMEOUT_CONTROL -eq 'true')
          exit $LASTEXITCODE
      - name: Mark setup/artifact blockers explicitly
        if: always()
        run: |
          if (-not (Test-Path -LiteralPath "$env:DIAGNOSTIC_ROOT/summary.json")) {
            New-Item -ItemType Directory -Path $env:DIAGNOSTIC_ROOT -Force | Out-Null
            @{ status = 'BLOCKED'; qualification = $false; reason = 'No completed native harness summary. Inspect setup/artifact/compile step; no driver success is claimed.' } |
              ConvertTo-Json | Set-Content -LiteralPath "$env:DIAGNOSTIC_ROOT/summary.json" -Encoding utf8
            '## BLOCKED: no native harness summary; not qualification' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            exit 1
          }
      - name: Upload raw evidence even after driver/oracle failure
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: edge-foreground-diagnostic-${{ github.run_id }}
          path: ${{ env.DIAGNOSTIC_ROOT }}
          if-no-files-found: error
          retention-days: 7
