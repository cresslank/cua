name: "CI: Rust Windows unit"
on:
  workflow_dispatch:
    inputs:
      proxy_idle_seconds:
        type: number
        default: 1
permissions:
  contents: read
env:
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
jobs:
  unit:
    name: Rust Windows unit and compile
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          save-if: false
      - name: Build and exercise exact elevated-token negative control
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_REQUIRE_DRIVER_BIN: "1"
        shell: pwsh
        run: |
          cargo build --locked -p cua-driver --bin cua-driver
          if ($LASTEXITCODE -ne 0) { throw "driver build failed: $LASTEXITCODE" }
          cargo build --locked -p cua-driver-testkit --example windows_launch_receiver
          if ($LASTEXITCODE -ne 0) { throw "receiver build failed: $LASTEXITCODE" }
          cargo test --locked -p cua-driver --test launch_app_standard_user_test -- --ignored --nocapture
          if ($LASTEXITCODE -eq 0) { throw "MUTATION SURVIVED: elevated Driver token was not caught" }
          throw "EXPECTED NEGATIVE CONTROL: inspect the exact receiver-token assertion, not this workflow exit"
