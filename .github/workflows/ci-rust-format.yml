name: "CI: Rust format"

on:
  pull_request:
    paths:
      - "libs/cua-driver/rust/**"
      - ".github/workflows/ci-rust-format.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/rust/**"
      - ".github/workflows/ci-rust-format.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rust-format-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  format:
    name: Rustfmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ (matrix.os == 'macos-latest' || matrix.os == 'macos-26') && vars.FORK_MACOS_CI_ENABLED == 'true' && vars.FORK_MACOS_RUNNER && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(fromJSON(vars.FORK_MACOS_EXCLUDE || '[]'), 'ci-rust-format/format') && fromJSON(vars.FORK_MACOS_RUNNER) || matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt
      - name: Check Rust formatting
        working-directory: libs/cua-driver/rust
        run: cargo fmt --all -- --check
